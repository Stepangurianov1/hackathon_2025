services:
  db:
    image: postgres:15-alpine
    container_name: ct_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ctdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
  app:
    build: .
    container_name: ct_app
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/ctdb
      - MODEL_CKPT=/app/outputs/final_model_200ct.pt
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db

  adminer:
    image: adminer:4
    container_name: ct_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:

